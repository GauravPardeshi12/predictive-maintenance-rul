project:
  name: Predictive-Maintenance-RUL
  random_seed: 42

paths:
  raw_data: data/raw
  models: models
  reports: reports
  metrics: reports/metrics
  figures: reports/figures
  predictions: reports/predictions
  logs: logs

dataset:
  num_sensors: 21

feature_engineering:
  rolling_window: 3

training:
  test_size: 0.2
  rul_cap: 125
  optuna_trials: 5

model:
  name: optimized_xgboost

random_forest:
  n_estimators: 200
  max_depth: 15
  random_state: 42
  n_jobs: -1

xgboost:
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  verbosity: 0

risk:
  critical_max_rul: 30
  warning_max_rul: 60
